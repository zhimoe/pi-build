name: Build Windows offline package
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
          architecture: x64
      - name: Build and verify portable package
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pi-1.5.0-windows-x64
          path: |
            out/*.zip
            out/SHA256SUMS.txt
          retention-days: 3
      - name: Publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "pi-1.5.0-build-$env:GITHUB_RUN_NUMBER"
          gh release create $tag out/*.zip out/SHA256SUMS.txt --title "Pi 1.5.0 Windows x64 offline (build $env:GITHUB_RUN_NUMBER)" --notes-file RELEASE.md --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
